dth="392.0" height="92" rx="10"/><text x="472.0" y="482.0" class="t2 sm" text-anchor="start">INSERT, 100k rows × 3 columns</text><text x="472.0" y="516.0" class="t1 big num" text-anchor="start">1.65M rows/s</text><text x="472.0" y="538.0" class="t3 xs" text-anchor="start">clickhouse-client: 1.64M rows/s · server-bound</text><text x="32.0" y="600.0" class="t3 xs" text-anchor="start">Loopback TCP, client and server in the same container. Medians of 7 timed passes (3 runs for clickzig), ReleaseFast.</text><text x="32.0" y="616.0" class="t3 xs" text-anchor="start">clickhouse-client is a reference, not a strict head-to-head: it also re-encodes Native output (to /dev/null); time via --time.</text><text x="32.0" y="632.0" class="t3 xs" text-anchor="start">INSERT goes to an ENGINE = Null table; both clients spend ~60ms/batch waiting on the server, so compression does not change it.</text></svg>
